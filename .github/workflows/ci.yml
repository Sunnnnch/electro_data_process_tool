name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browser and verify MCP SDK
        run: |
          python -m playwright install chromium
          python -c "from mcp.server.fastmcp import FastMCP; from mcp.client.stdio import stdio_client"

      - name: Lint (ruff)
        run: ruff check src/ tests/ --output-format=github

      - name: Type check (pyright)
        run: pyright src/

      - name: Run check
        env:
          PYTHONUTF8: "1"
        run: python run_v6.py check

      - name: Run smoke
        env:
          PYTHONUTF8: "1"
        run: python run_v6.py smoke --port 8011

      - name: Run tests
        env:
          ELECTROCHEM_REQUIRE_PLAYWRIGHT: "1"
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q --tb=short --cov=src/electrochem_v6 --cov-report=term-missing --cov-fail-under=65
