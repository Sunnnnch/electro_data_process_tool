[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electrochem-v6"
dynamic = ["version", "dependencies"]
description = "智能电化学数据处理软件"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sunnnnch" }]
keywords = ["electrochemistry", "LSV", "CV", "EIS", "data-processing"]

[project.scripts]
electrochem-mcp = "electrochem_v6.mcp_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "electrochem_v6.config.APP_VERSION" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
electrochem_v6 = ["ui/static/*", "desktop/assets/*"]

# Releases use an explicitly reviewed APP_VERSION, tag, and commit. No automatic
# semantic-release configuration may recalculate or rewrite that version.

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import not at top (matplotlib.use must precede imports)
    "E741",   # ambiguous variable name — `I` is standard for current in electrochemistry
    "E701",   # multiple statements on one line (colon) — compact data parsing
    "E702",   # multiple statements on one line (semicolon) — compact data parsing
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"processing_core_v6.py" = ["E402", "F401", "F841"]
"processing_ecsa.py" = ["F841"]
"processing_lsv.py" = ["F841"]
"conftest.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
